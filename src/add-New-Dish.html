<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>Add New dish</title>
</head>
<body class="bg-gray-50">
  <div class="max-w-3xl m-auto h-auto rounded-2xl bg-white mt-10 shadow-md">
    <form action="">
        <div class="p-8">
            <p class="font-bold text-[20px] py-4">Add new dish</p>
            <div class="py-1.5">
                <label class="font-semibold text-gray-600" for="">Dish name</label><br>
                <input class="w-full border-[1px] border-gray-300 p-1.5 my-1.5 rounded-[8px]" type="text" name="" id="">
            </div>

            <div class="py-3">
                <label class="font-semibold text-gray-600" for="">Dish description</label><br>
                <textarea class="w-full border-[1px] border-gray-300 p-1.5 my-1.5 rounded-[8px]" cols="20" rows="6">  
                </textarea>
            </div>

            <div class="flex flex-col md:flex-row justify-between py-3">
                <div class="w-full space-x-4 md:mr-4">
                    <label class="font-semibold text-gray-600" for="">Price (₦)</label>
                    <input class="w-full border-[1px] border-gray-300 p-1.5 my-1.5 rounded-[8px]" type="text" name="" id="">
                </div>

                <div class="w-full">
                    <label class="font-semibold text-gray-600" for="">Category</label>
                    <select class="w-full border-[1px] border-gray-300 p-1.5 my-1.5 rounded-[8px] text-gray-500" name="" id="">
                        <option class="" value="">Choose from options---</option>
                        <option value="">Beef Pizza</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="font-semibold text-gray-600" for="">Image URL</label>
                <input class="w-full border-[1px] border-gray-300 p-1.5 my-1.5 rounded-[8px]" type="url" name="" id="">
            </div>

            <div>
                <input class="border-[1px] border-gray-300 p-1.5 my-3" type="checkbox" name="" id=""> <label class="font-semibold text-gray-600" for="">Available for ordering</label>
            </div>

            <div class="flex flex-row justify-end space-x-3.5">
                <input class="px-8 py-2 rounded-full shadow-md font-bold hover:bg-[#f1f1f1] cursor-pointer" type="button" value="Cancel">
                <input class="px-8 py-2 rounded-full bg-[#ff7800] text-white font-bold hover:bg-[#FFAC41] cursor-pointer" type="button" value="Add dish">
            </div>
        </div>
    </form>
  </div>
</body>
</html>

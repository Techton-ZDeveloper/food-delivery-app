<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>Add New dish</title>
</head>
<body class="bg-gray-50">
  <div class="max-w-3xl m-auto h-auto rounded-2xl bg-white">
    <form action="">
        <div class="p-8">
            <p class="font-bold text-[20px] py-4">Add new dish</p>
            <div class="py-1.5">
                <label class="font-semibold text-gray-600" for="">Dish name</label><br>
                <input class="w-full border-[1px] border-gray-300 p-1.5 rounded-[8px]" type="text" name="" id="">
            </div>

            <div>
                <label class="font-semibold text-gray-600" for="">Dish description</label><br>
                <textarea class="w-full border-[1px] border-gray-300 p-1.5 rounded-[8px]" cols="20" rows="6">  
                </textarea>
            </div>

            <div class="flex flex-col md:flex-row justify-between space-5">
                <div class="w-full">
                    <label class="font-semibold text-gray-600" for="">Price (₦)</label>
                    <input class="w-full border-[1px] border-gray-300 p-1.5 rounded-[8px]" type="text" name="" id="">
                </div>

                <div class="w-full">
                    <label class="font-semibold text-gray-600" for="">Category</label>
                    <select class="w-full border-[1px] border-gray-300 p-1.5 rounded-[8px] text-gray-500" name="" id="">
                        <option class="" value="">Choose from options---</option>
                        <option value="">Beef Pizza</option>
                    </select>
                </div>
            </div>
        </div>
    </form>
  </div>
</body>
</html>
